<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Don Gil · Panel de sede</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="img/logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Lilita+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="barra">
    <a class="barra__logo" href="/" aria-label="Ir a la página"><img src="img/logo.webp" alt="Don Gil" width="48" height="48"></a>
    <div class="barra__titulo">
      <h1>Panel de sede</h1>
      <span class="vivo" id="vivo"><i></i><span id="vivo-texto">En vivo</span></span>
    </div>
    <label class="campo">
      <span>Sede</span>
      <select id="filtro"><option value="">Todas</option></select>
    </label>
    <button class="sonido" id="sonido" type="button" aria-pressed="false">Sonido: apagado</button>
  </header>

  <main>
    <section class="cifras" aria-label="Resumen">
      <div class="cifra"><strong id="c-nuevos">0</strong><span>Nuevos</span></div>
      <div class="cifra"><strong id="c-prep">0</strong><span>En preparación</span></div>
      <div class="cifra"><strong id="c-listos">0</strong><span>Listos</span></div>
      <div class="cifra cifra--ventas"><strong id="c-ventas">$0</strong><span>Vendido en pedidos</span></div>
    </section>

    <section class="avisos" id="avisos-seccion" hidden>
      <h2>Avisos para el equipo <span class="cuenta" id="n-avisos">0</span></h2>
      <div class="avisos__lista" id="avisos"></div>
    </section>

    <section class="tablero" aria-label="Pedidos">
      <div class="columna" data-estado="Nuevo">
        <h2>Nuevos <span class="cuenta" id="n-Nuevo">0</span></h2>
        <div class="columna__lista" id="col-Nuevo"></div>
      </div>
      <div class="columna" data-estado="En preparación">
        <h2>En preparación <span class="cuenta" id="n-prep">0</span></h2>
        <div class="columna__lista" id="col-prep"></div>
      </div>
      <div class="columna" data-estado="Listo">
        <h2>Listos <span class="cuenta" id="n-Listo">0</span></h2>
        <div class="columna__lista" id="col-Listo"></div>
      </div>
    </section>

    <details class="entregados">
      <summary>Entregados <span class="cuenta" id="n-Entregado">0</span></summary>
      <div class="entregados__lista" id="col-Entregado"></div>
    </details>
  </main>

  <script src="panel.js"></script>
</body>
</html>
